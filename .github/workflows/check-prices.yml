name: Check car prices

on:
  schedule:
    - cron: '30 7 * * 1'   # Mondays 09:30 SAST
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python check_prices.py
