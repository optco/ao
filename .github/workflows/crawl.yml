name: Auto Crawl SA Car Sites

on:
  schedule:
    - cron: '0 */6 * * *' # Runs automatically every 6 hours
  workflow_dispatch:      # Allows manual runs from the GitHub Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright & Chromium
        run: |
          pip install playwright
          playwright install chromium

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push updated car data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add cars.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update SA car listings" && git push)
